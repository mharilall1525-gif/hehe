<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for you</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #a18cd1);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
  overflow: hidden;
}

/* glow background */
body::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background: radial-gradient(white 1px, transparent 1px);
  background-size: 35px 35px;
  opacity: 0.2;
  animation: move 50s linear infinite;
}
@keyframes move {
  from { transform: translate(0,0); }
  to { transform: translate(-200px, -200px); }
}

.container {
  max-width: 420px;
  padding: 30px;
  background: rgba(0,0,0,0.25);
  border-radius: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 40px rgba(255,255,255,0.2);
  z-index: 1;
}

.stitch {
  width: 130px;
  margin-bottom: 10px;
}

button {
  margin-top: 20px;
  padding: 12px 20px;
  border: none;
  border-radius: 25px;
  font-size: 15px;
  cursor: pointer;
}

.primary {
  background: white;
  color: #ff7eb3;
}

.hidden {
  display: none;
}

/* overlay */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  flex-direction: column;
}

/* hearts */
.heart {
  position: absolute;
  font-size: 20px;
  animation: float 5s linear infinite;
}
@keyframes float {
  from { transform: translateY(100vh); opacity: 1; }
  to { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<!-- overlay for music -->
<div class="overlay" id="overlay" onclick="startExperience()">
  <h2>tap to start 💙</h2>
</div>

<audio id="music" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="container hidden" id="main">
  <img src="stitch.png" class="stitch">
  <h2 id="text"></h2>
  <button class="primary" onclick="next()">continue</button>
</div>

<div class="container hidden" id="final">
  <h2>sooo…</h2>
  <p>do you want to be my girlfriend?</p>
  <button class="primary" onclick="yes()">yes 🙂</button>
</div>

<script>
const lines = [
  "hey alyssa :)",
  "i made this for you",
  "i’ve really liked getting to know you",
  "you make everything feel easy",
  "and i always look forward to seeing you",
  "i know i said i like taking things slow",
  "but i don’t want this to feel casual anymore",
  "i really like you"
];

let index = 0;

function startExperience() {
  document.getElementById("overlay").style.display = "none";
  document.getElementById("main").classList.remove("hidden");
  document.getElementById("music").play();
  typeLine();
}

function typeLine() {
  let text = lines[index];
  let i = 0;
  let display = "";

  let typing = setInterval(() => {
    display += text[i];
    document.getElementById("text").innerHTML = display;
    i++;
    if (i >= text.length) clearInterval(typing);
  }, 40);
}

function next() {
  index++;
  if (index < lines.length) {
    document.getElementById("text").innerHTML = "";
    typeLine();
  } else {
    document.getElementById("main").classList.add("hidden");
    document.getElementById("final").classList.remove("hidden");
  }
}

function yes() {
  document.getElementById("final").innerHTML = "<h2>😊</h2><p>okay good… i was hoping you’d say that</p>";
  spawnHearts();
}

function spawnHearts() {
  setInterval(() => {
    let heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
  }, 300);
}
</script>

</body>
</html>
